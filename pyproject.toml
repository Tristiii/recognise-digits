[project]
name = "recognise-digits"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tristiii", email = "tristiii.games@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.1.0.95",
    "pandas>=3.1.1",
    "pyside6>=6.12.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
recognise-digits = "recognise_digits:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
